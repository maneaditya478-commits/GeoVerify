version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: geoverify-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: geoverify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoverify-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgrespassword@db:5432/geoverify
      - GEOCODER_PROVIDER=mock
      - APP_ENV=production
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geoverify-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
